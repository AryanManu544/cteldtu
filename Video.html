<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTU Virtual Tour</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="bg-gray-50 py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                <!-- Left Side - Text Content -->
                <div>
                    <h2 class="text-4xl font-bold text-red-600 mb-6">DTU - A Virtual Tour</h2>
                    <p class="text-gray-700 text-lg leading-relaxed mb-4">
                        Delhi Technological University stands as a premier engineering institute, 
                        a crucible of innovation, leadership, and excellence. Since its establishment, 
                        DTU has shaped minds, inspired dreams, and transformed futures.
                    </p>
                </div>

                <!-- Right Side - Video Player -->
                <div class="relative">
                    <div class="relative w-full" style="padding-bottom: 56.25%;">
                        <iframe
                            class="absolute top-0 left-0 w-full h-full rounded-lg shadow-lg"
                            src="https://www.youtube.com/embed/pYfLvmp7JQw"
                            title="DTU - A Short Film"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen
                        ></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
